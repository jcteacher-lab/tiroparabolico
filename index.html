<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiro Parabólico Interactivo</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1b2b3e 0%, #0f1a26 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .contenedor {
            background: rgba(22, 34, 48, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 24px 28px 28px 28px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
            max-width: 1050px;
            width: fit-content;
            margin: 0 auto;
        }
        h1 {
            margin: 0 0 8px 0;
            font-weight: 500;
            font-size: 2rem;
            text-align: center;
            color: #e3f0ff;
            letter-spacing: 1px;
            text-shadow: 0 2px 5px #00000040;
        }
        .subtitulo {
            text-align: center;
            color: #9bb8da;
            margin-bottom: 22px;
            font-size: 1rem;
            font-weight: 300;
            border-bottom: 1px solid #2d4055;
            padding-bottom: 12px;
        }
        .zona-principal {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            align-items: flex-start;
        }
        .canvas-wrapper {
            background: #0d151f;
            border-radius: 20px;
            padding: 12px;
            box-shadow: inset 0 0 15px #00000080, 0 10px 25px #00000060;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            background: #0a111a;
            cursor: crosshair;
        }
        .panel {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .control {
            background: #1e2c3c;
            border-radius: 18px;
            padding: 14px 18px;
            box-shadow: inset 0 1px 3px #ffffff0d, 0 6px 12px #00000040;
            border: 1px solid #2d4055;
        }
        .control label {
            display: block;
            color: #bfd6f0;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .control input[type="range"] {
            width: 100%;
            margin: 5px 0 10px 0;
            -webkit-appearance: none;
            background: transparent;
        }
        .control input[type="range"]:focus {
            outline: none;
        }
        .control input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            background: #2d4055;
            border-radius: 10px;
            box-shadow: inset 0 1px 3px #000000;
        }
        .control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #63b3ff;
            margin-top: -7px;
            box-shadow: 0 2px 8px #000000, 0 0 10px #63b3ffaa;
            border: 2px solid #ffffff;
            cursor: pointer;
        }
        .control input[type="range"]::-moz-range-track {
            height: 6px;
            background: #2d4055;
            border-radius: 10px;
        }
        .control input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #63b3ff;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 8px #000000;
            cursor: pointer;
        }
        .valor {
            color: #e3f0ff;
            font-weight: 600;
            font-size: 1.1rem;
            float: right;
        }
        .datos {
            background: #13212e;
            border-radius: 18px;
            padding: 16px 18px;
            border: 1px solid #2d4055;
            box-shadow: inset 0 1px 3px #ffffff0d, 0 6px 12px #00000040;
        }
        .dato {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            color: #9bb8da;
            font-size: 0.95rem;
        }
        .dato .num {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-weight: 700;
            font-size: 1.3rem;
            color: #b7e0ff;
            text-shadow: 0 0 8px #63b3ff80;
            letter-spacing: 0.5px;
        }
        .dato .unidad {
            font-size: 0.8rem;
            color: #6b8aa8;
            margin-left: 4px;
        }
        .boton {
            background: #2d4a6b;
            border: none;
            border-radius: 40px;
            padding: 14px 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: #e3f0ff;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 8px 0 #0a121c, 0 6px 18px #00000080;
            transition: all 0.07s ease;
            border: 1px solid #4d7aa8;
            width: 100%;
            margin-top: 6px;
        }
        .boton:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #0a121c, 0 6px 18px #00000080;
        }
        .boton:hover {
            background: #3a5f88;
            border-color: #6d9fd8;
        }
        .firma {
            text-align: center;
            color: #4b6077;
            font-size: 0.75rem;
            margin-top: 16px;
            letter-spacing: 0.8px;
        }

        /* ===== MÓDULO NUEVO: Estilos de la tabla de tabulación ===== */
        .tabulacion {
            background: #13212e;
            border-radius: 18px;
            padding: 12px 14px;
            border: 1px solid #2d4055;
            box-shadow: inset 0 1px 3px #ffffff0d, 0 6px 12px #00000040;
        }
        .tab-titulo {
            color: #bfd6f0;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .tab-scroll {
            max-height: 220px;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #223649;
        }
        .tab-scroll::-webkit-scrollbar { width: 8px; }
        .tab-scroll::-webkit-scrollbar-track { background: #0d151f; }
        .tab-scroll::-webkit-scrollbar-thumb {
            background: #2d4a6b;
            border-radius: 4px;
        }
        #tablaTrayectoria {
            width: 100%;
            border-collapse: collapse;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.78rem;
        }
        #tablaTrayectoria thead th {
            position: sticky;
            top: 0;
            background: #1e2c3c;
            color: #9bb8da;
            font-weight: 600;
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid #2d4055;
            letter-spacing: 0.3px;
        }
        #tablaTrayectoria tbody td {
            padding: 4px 4px;
            text-align: center;
            color: #d7e8ff;
            border-bottom: 1px solid #1a2836;
        }
        #tablaTrayectoria tbody tr:nth-child(even) {
            background: #0f1c28;
        }
        #tablaTrayectoria tbody tr.fila-final {
            background: #2a3f1e;
            color: #c8f5a0;
            font-weight: 700;
        }
        #tablaTrayectoria td.vacio {
            color: #4b6077;
            font-style: italic;
            padding: 12px;
        }

        @media (max-width: 700px) {
            .contenedor { padding: 16px; }
            .panel { width: 100%; }
        }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>⚡ Tiro Parabólico</h1>
    <div class="subtitulo">Ajusta los parámetros y observa la trayectoria</div>

    <div class="zona-principal">
        <div class="canvas-wrapper">
            <canvas id="lienzo" width="640" height="480"></canvas>
        </div>

        <div class="panel">
            <div class="control">
                <label>Velocidad inicial <span class="valor" id="velVal">30 m/s</span></label>
                <input type="range" id="velocidad" min="5" max="80" value="30" step="0.5">
            </div>
            <div class="control">
                <label>Ángulo <span class="valor" id="angVal">45°</span></label>
                <input type="range" id="angulo" min="5" max="85" value="45" step="1">
            </div>
            <div class="datos">
                <div class="dato">
                    <span>⏱️ Tiempo de vuelo</span>
                    <span><span class="num" id="tiempoVuelo">4.33</span><span class="unidad">s</span></span>
                </div>
                <div class="dato">
                    <span>📏 Alcance máx.</span>
                    <span><span class="num" id="alcanceMax">91.7</span><span class="unidad">m</span></span>
                </div>
                <div class="dato">
                    <span>📈 Altura máx.</span>
                    <span><span class="num" id="alturaMax">22.9</span><span class="unidad">m</span></span>
                </div>
            </div>

            <!-- ===== MÓDULO NUEVO: TABULACIÓN POR SEGUNDO ===== -->
            <div class="tabulacion">
                <div class="tab-titulo">📋 Tabulación por segundo</div>
                <div class="tab-scroll">
                    <table id="tablaTrayectoria">
                        <thead>
                            <tr>
                                <th>t (s)</th>
                                <th>x (m)</th>
                                <th>y (m)</th>
                                <th>vₓ (m/s)</th>
                                <th>v_y (m/s)</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                            <tr><td colspan="5" class="vacio">— Sin datos —</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- ===== FIN MÓDULO NUEVO ===== -->

            <button class="boton" id="btnLanzar">🚀 Lanzar proyectil</button>
        </div>
    </div>
    <div class="firma">Canvas 2D · Animación interactiva</div>
</div>

<script>
    (function() {
        // ========== CONSTANTES Y VARIABLES ==========
        const canvas = document.getElementById('lienzo');
        const ctx = canvas.getContext('2d');

        // Entradas
        const velInput = document.getElementById('velocidad');
        const angInput = document.getElementById('angulo');
        const velVal = document.getElementById('velVal');
        const angVal = document.getElementById('angVal');
        const btnLanzar = document.getElementById('btnLanzar');

        // Salidas
        const tiempoVueloEl = document.getElementById('tiempoVuelo');
        const alcanceMaxEl = document.getElementById('alcanceMax');
        const alturaMaxEl = document.getElementById('alturaMax');

        // Parámetros físicos
        const G = 9.81;            // gravedad m/s²
        let velocidad = 30;        // m/s
        let angulo = 45;           // grados

        // Estado de la animación
        let animacionActiva = false;
        let tiempoTranscurrido = 0;       // segundos
        let ultimoTimestamp = 0;
        let idAnimacion = null;
        let trayectoriaCompleta = [];      // puntos {x, y} en metros

        // Datos calculados (en metros/segundos)
        let tVuelo = 0;
        let xMax = 0;
        let yMax = 0;

        // Escala y offsets (se actualizan dinámicamente)
        let escalaX = 1, escalaY = 1;
        let offsetX = 50, offsetY = 50;

        // ========== FUNCIONES DE CÁLCULO ==========
        function calcularParametros() {
            const rad = angulo * Math.PI / 180;
            const v0 = velocidad;
            const v0x = v0 * Math.cos(rad);
            const v0y = v0 * Math.sin(rad);

            tVuelo = (2 * v0y) / G;
            if (tVuelo < 0) tVuelo = 0;

            xMax = v0x * tVuelo;
            yMax = (v0y * v0y) / (2 * G);

            tiempoVueloEl.textContent = tVuelo.toFixed(2);
            alcanceMaxEl.textContent = xMax.toFixed(1);
            alturaMaxEl.textContent = yMax.toFixed(1);

            return { v0x, v0y };
        }

        // ========== CONFIGURACIÓN DE ESCALA ==========
        function actualizarEscalaYOffset() {
            // ===== AJUSTE NUEVO: márgenes reducidos para aprovechar el espacio vertical =====
            const margenIzq = 55;
            const margenDer = 30;
            const margenSup = 18;   // antes 40 → menos espacio desperdiciado arriba
            const margenInf = 38;   // antes 50 → menos espacio desperdiciado abajo

            const anchoUtil = canvas.width - margenIzq - margenDer;
            const altoUtil = canvas.height - margenSup - margenInf;

            const maxX = Math.max(xMax, 1);
            const maxY = Math.max(yMax, 1);

            const escalaXtemp = anchoUtil / (maxX * 1.05);
            const escalaYtemp = altoUtil / (maxY * 1.05);
            const escalaUniforme = Math.min(escalaXtemp, escalaYtemp);
            escalaX = escalaUniforme;
            escalaY = escalaUniforme;

            offsetX = margenIzq;
            offsetY = canvas.height - margenInf;
        }

        // ========== DIBUJO PRINCIPAL ==========
        function dibujar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0a111a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            dibujarEjesYCuadricula();

            if (trayectoriaCompleta.length > 1) {
                dibujarTrayectoria(trayectoriaCompleta, '#63b3ff', 3, 0.9);
            }

            if (animacionActiva) {
                const puntosParciales = generarPuntosHastaTiempo(tiempoTranscurrido);
                if (puntosParciales.length > 1) {
                    dibujarTrayectoria(puntosParciales, '#ffd966', 4, 1);
                }
                const posActual = calcularPosicion(tiempoTranscurrido);
                if (posActual && tiempoTranscurrido <= tVuelo) {
                    dibujarProyectil(posActual.x, posActual.y);
                }
            } else {
                if (tVuelo > 0.001) {
                    const puntosCompletos = generarPuntosHastaTiempo(tVuelo);
                    dibujarTrayectoria(puntosCompletos, '#63b3ff', 3, 0.8);
                    const puntoFinal = calcularPosicion(tVuelo);
                    if (puntoFinal) {
                        dibujarProyectil(puntoFinal.x, puntoFinal.y);
                    }
                }
            }

            dibujarEtiquetas();
        }

        function generarPuntosHastaTiempo(tMax) {
            const puntos = [];
            const { v0x, v0y } = calcularParametros();
            const pasos = 200;
            for (let i = 0; i <= pasos; i++) {
                const t = (i / pasos) * tMax;
                const x = v0x * t;
                const y = v0y * t - 0.5 * G * t * t;
                if (y < -0.1) continue;
                puntos.push({ x, y: Math.max(0, y) });
            }
            return puntos;
        }

        function calcularPosicion(t) {
            const rad = angulo * Math.PI / 180;
            const v0x = velocidad * Math.cos(rad);
            const v0y = velocidad * Math.sin(rad);
            const x = v0x * t;
            const y = v0y * t - 0.5 * G * t * t;
            return { x, y: Math.max(0, y) };
        }

        // ========== DIBUJO DE ELEMENTOS ==========
        function dibujarEjesYCuadricula() {
            ctx.save();
            ctx.beginPath();
            ctx.strokeStyle = '#4b6e8f';
            ctx.lineWidth = 2.5;
            ctx.moveTo(offsetX - 5, offsetY);
            ctx.lineTo(offsetX + canvas.width - 80, offsetY);
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#4b6e8f';
            ctx.lineWidth = 2.5;
            ctx.moveTo(offsetX, offsetY + 5);
            ctx.lineTo(offsetX, offsetY - canvas.height + 80);
            ctx.stroke();

            ctx.fillStyle = '#4b6e8f';
            ctx.beginPath();
            ctx.moveTo(offsetX + canvas.width - 75, offsetY - 6);
            ctx.lineTo(offsetX + canvas.width - 60, offsetY);
            ctx.lineTo(offsetX + canvas.width - 75, offsetY + 6);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(offsetX - 6, offsetY - canvas.height + 75);
            ctx.lineTo(offsetX, offsetY - canvas.height + 60);
            ctx.lineTo(offsetX + 6, offsetY - canvas.height + 75);
            ctx.fill();

            ctx.font = 'bold 14px "Segoe UI", monospace';
            ctx.fillStyle = '#9bb8da';
            ctx.fillText('x (m)', offsetX + canvas.width - 80, offsetY - 15);
            ctx.save();
            ctx.translate(offsetX - 25, offsetY - canvas.height + 80);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('y (m)', 0, 0);
            ctx.restore();

            const maxXMetros = xMax > 0 ? xMax : 50;
            const maxYMetros = yMax > 0 ? yMax : 30;

            const pasoX = elegirPaso(maxXMetros);
            const pasoY = elegirPaso(maxYMetros);

            ctx.strokeStyle = '#1e2f40';
            ctx.lineWidth = 0.8;
            ctx.font = '11px "Segoe UI", monospace';
            ctx.fillStyle = '#3f5c78';

            for (let xm = pasoX; xm <= maxXMetros * 1.2; xm += pasoX) {
                const px = offsetX + xm * escalaX;
                if (px > canvas.width - 30) break;
                ctx.beginPath();
                ctx.moveTo(px, offsetY);
                ctx.lineTo(px, offsetY - maxYMetros * escalaY - 10);
                ctx.stroke();
                ctx.fillText(xm.toFixed(0), px - 8, offsetY + 20);
            }

            for (let ym = pasoY; ym <= maxYMetros * 1.2; ym += pasoY) {
                const py = offsetY - ym * escalaY;
                if (py < 20) break;
                ctx.beginPath();
                ctx.moveTo(offsetX, py);
                ctx.lineTo(offsetX + maxXMetros * escalaX + 20, py);
                ctx.stroke();
                ctx.fillText(ym.toFixed(0), offsetX - 35, py + 4);
            }

            ctx.restore();
        }

        function elegirPaso(maxMetros) {
            const opciones = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500];
            const objetivo = maxMetros / 6;
            let mejor = opciones[0];
            let minDif = Infinity;
            for (let op of opciones) {
                const dif = Math.abs(op - objetivo);
                if (dif < minDif) {
                    minDif = dif;
                    mejor = op;
                }
            }
            return mejor;
        }

        function dibujarTrayectoria(puntos, color, grosor, alpha) {
            if (puntos.length < 2) return;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = grosor;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = color;
            ctx.shadowBlur = 12;
            for (let i = 0; i < puntos.length; i++) {
                const p = puntos[i];
                const px = offsetX + p.x * escalaX;
                const py = offsetY - p.y * escalaY;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();
        }

        function dibujarProyectil(xm, ym) {
            const px = offsetX + xm * escalaX;
            const py = offsetY - ym * escalaY;
            ctx.save();
            ctx.shadowColor = '#ffaa33';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(px, py, 9, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffbb33';
            ctx.fill();
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#fff9e6';
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
        }

        function dibujarEtiquetas() {
            ctx.save();
            ctx.font = 'bold 13px "Segoe UI"';
            ctx.fillStyle = '#bfd6f0';
            ctx.shadowColor = '#000000';
            ctx.shadowBlur = 6;
            ctx.fillText(`Alcance: ${xMax.toFixed(1)} m`, offsetX + 20, offsetY - 20);
            ctx.fillText(`Altura máx: ${yMax.toFixed(1)} m`, offsetX + 20, offsetY - 45);
            ctx.restore();
        }

        // ========== ANIMACIÓN ==========
        function iniciarAnimacion() {
            if (animacionActiva) {
                cancelAnimationFrame(idAnimacion);
                animacionActiva = false;
            }

            calcularParametros();
            if (tVuelo <= 0) {
                dibujar();
                return;
            }

            animacionActiva = true;
            tiempoTranscurrido = 0;
            trayectoriaCompleta = [];
            ultimoTimestamp = performance.now();

            actualizarEscalaYOffset();

            function paso(timestamp) {
                if (!animacionActiva) return;

                const deltaSeg = Math.min(0.05, (timestamp - ultimoTimestamp) / 1000);
                ultimoTimestamp = timestamp;
                const factorVelocidad = 0.8;
                tiempoTranscurrido += deltaSeg * factorVelocidad;

                if (tiempoTranscurrido >= tVuelo) {
                    tiempoTranscurrido = tVuelo;
                    trayectoriaCompleta = generarPuntosHastaTiempo(tVuelo);
                    animacionActiva = false;
                    dibujar();
                    return;
                }

                dibujar();
                idAnimacion = requestAnimationFrame(paso);
            }

            idAnimacion = requestAnimationFrame(paso);
        }

        // ========== ACTUALIZAR INTERFAZ ==========
        function actualizarDesdeControles() {
            velocidad = parseFloat(velInput.value);
            angulo = parseFloat(angInput.value);
            velVal.textContent = velocidad.toFixed(1) + ' m/s';
            angVal.textContent = angulo + '°';

            calcularParametros();

            if (animacionActiva) {
                cancelAnimationFrame(idAnimacion);
                animacionActiva = false;
            }
            trayectoriaCompleta = [];
            actualizarEscalaYOffset();
            dibujar();

            // ===== MÓDULO NUEVO: reconstruir tabulación al cambiar parámetros =====
            construirTablaTrayectoria();
        }

        // ===== MÓDULO NUEVO: TABULACIÓN POR SEGUNDO =====
        const cuerpoTabla = document.getElementById('cuerpoTabla');

        function construirTablaTrayectoria() {
            if (!cuerpoTabla) return;
            if (tVuelo <= 0.001) {
                cuerpoTabla.innerHTML = '<tr><td colspan="5" class="vacio">— Sin datos —</td></tr>';
                return;
            }

            const rad = angulo * Math.PI / 180;
            const v0x = velocidad * Math.cos(rad);
            const v0y = velocidad * Math.sin(rad);

            let html = '';
            let t = 0;
            const dt = 1.0;

            while (t <= tVuelo + 1e-9) {
                const x = v0x * t;
                const y = Math.max(0, v0y * t - 0.5 * G * t * t);
                const vy = v0y - G * t;
                html += `<tr>
                            <td>${t.toFixed(1)}</td>
                            <td>${x.toFixed(2)}</td>
                            <td>${y.toFixed(2)}</td>
                            <td>${v0x.toFixed(2)}</td>
                            <td>${vy.toFixed(2)}</td>
                         </tr>`;
                t += dt;
            }

            const xf = v0x * tVuelo;
            const vyf = v0y - G * tVuelo;
            html += `<tr class="fila-final">
                        <td>${tVuelo.toFixed(2)}</td>
                        <td>${xf.toFixed(2)}</td>
                        <td>0.00</td>
                        <td>${v0x.toFixed(2)}</td>
                        <td>${vyf.toFixed(2)}</td>
                     </tr>`;

            cuerpoTabla.innerHTML = html;
        }

        function limpiarTablaTrayectoria() {
            if (cuerpoTabla) {
                cuerpoTabla.innerHTML = '<tr><td colspan="5" class="vacio">— Sin datos —</td></tr>';
            }
        }
        // ===== FIN MÓDULO NUEVO =====

        // ========== EVENTOS ==========
        velInput.addEventListener('input', actualizarDesdeControles);
        angInput.addEventListener('input', actualizarDesdeControles);

        btnLanzar.addEventListener('click', () => {
            // ===== MÓDULO NUEVO: reconstruir tabulación antes de lanzar =====
            construirTablaTrayectoria();

            if (animacionActiva) {
                cancelAnimationFrame(idAnimacion);
                animacionActiva = false;
            }
            calcularParametros();
            actualizarEscalaYOffset();
            iniciarAnimacion();
        });

        // ========== INICIALIZACIÓN ==========
        function init() {
            velInput.value = 30;
            angInput.value = 45;
            velocidad = 30;
            angulo = 45;
            velVal.textContent = '30.0 m/s';
            angVal.textContent = '45°';

            calcularParametros();
            actualizarEscalaYOffset();
            dibujar();

            // ===== MÓDULO NUEVO: tabla inicial =====
            construirTablaTrayectoria();
        }

        init();
    })();
</script>
</body>
</html>
